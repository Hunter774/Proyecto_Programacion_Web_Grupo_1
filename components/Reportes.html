<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - X-Bits Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="../static/Icono.png" alt="Logo X-Bits" class="logo-img">
      <h1>X-Bits Admin</h1>
    </div>

    <nav>
      <ul>
        <li><a href="producto.html">Productos</a></li>
        <li><a href="reportes.html" style="color: #3498db;">Reportes</a></li>
        <li><a href="#" id="saludo-admin" style="color: #2ecc71;">Admin</a></li>
        <li><a href="#" onclick="cerrarSesion()">Salir</a></li>
      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Reporte de Transacciones y Carritos</h2>
    <p class="subtitulo">Consulta el historial de productos en los carritos de los usuarios</p>

    <form class="formulario" id="form-filtros" onsubmit="event.preventDefault();">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;">
        
        <div>
          <label for="buscar_cliente">Buscar por Cliente:</label>
          <input type="text" id="buscar_cliente" placeholder="Ej: Roberto" oninput="filtrarReportes()">
        </div>

      </div>
    </form>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>ID Detalle</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="tabla-reportes">
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits - Panel de Administración</p>
  </footer>

  <script>
    const adminData = JSON.parse(localStorage.getItem("adminXBits"));
    if (!adminData) {
      alert("Acceso denegado. Inicia sesión primero.");
      window.location.replace("login.html");
    } else {
      document.getElementById("saludo-admin").innerText = `Hola, ${adminData.nombre}`;
    }

    function cerrarSesion() {
      localStorage.removeItem("adminXBits");
      window.location.replace("login.html");
    }

    let reportesGlobal = [];

    function cargarReportes() {
      fetch("http://127.0.0.1:5000/reportes")
        .then(res => res.json())
        .then(data => {
          reportesGlobal = data || [];
          mostrarTabla(reportesGlobal);
        })
        .catch(err => {
          console.error("Error al cargar reportes:", err);
          document.getElementById("tabla-reportes").innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Error al conectar con el servidor.</td></tr>`;
        });
    }

    function mostrarTabla(datos) {
      const tbody = document.getElementById("tabla-reportes");
      tbody.innerHTML = "";

      if (!datos || datos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No se encontraron registros.</td></tr>`;
        return;
      }

      datos.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>#TX-${r.id_detalle}</td>
            <td>${r.cliente}</td>
            <td>${r.producto}</td>
            <td>${r.cantidad}</td>
            <td>$${r.precio_unitario}</td>
            <td>$${r.subtotal}</td>
          </tr>
        `;
      });
    }

    function filtrarReportes() {
      const texto = document.getElementById("buscar_cliente").value.toLowerCase().trim();
      const filtrados = reportesGlobal.filter(r => r.cliente.toLowerCase().includes(texto));
      mostrarTabla(filtrados);
    }

    cargarReportes();
  </script>

</body>
</html>
