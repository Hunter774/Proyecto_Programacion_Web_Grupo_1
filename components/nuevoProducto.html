<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto - X-Bits Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="../static/Icono.png" alt="Logo Xucle-Bits" class="logo-img">
      <h1>X-Bits Admin</h1>
    </div>

    <nav>
      <ul>
        <li><a href="producto.html">Productos</a></li>
        <li><a href="reportes.html">Reportes</a></li>
      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Agregar Nuevo Producto</h2>

    <form class="formulario" id="form-nuevo">
      <label for="nombre">Nombre del producto:</label>
      <input type="text" id="nombre" required>

      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" required></textarea>

      <label for="precio">Precio:</label>
      <input type="number" id="precio" step="0.01" min="0" required>

      <label for="stock">Cantidad / Stock:</label>
      <input type="number" id="stock" min="0" required>

      <label for="color">Color:</label>
      <input type="text" id="color">

      <label for="estado">Estado:</label>
      <select id="estado" required>
        <option value="activo" selected>Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>

      <label for="imagen">URL de imagen:</label>
      <input type="text" id="imagen" placeholder="https://ejemplo.com/imagen.png">

      <div class="form-acciones">
        <button type="submit" class="btn-principal">Guardar Producto</button>
        <a href="producto.html" class="btn-secundario">Cancelar</a>
      </div>
    </form>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits - Panel de Administración</p>
  </footer>

  <script>
    // Validar sesión activa de administrador
    const adminData = JSON.parse(localStorage.getItem("adminXBits"));
    if (!adminData) {
      alert("Acceso denegado. Inicia sesión primero.");
      window.location.replace("login.html");
    }

    document.getElementById("form-nuevo").addEventListener("submit", function(e) {
      e.preventDefault();

      const nuevoProducto = {
        nombre: document.getElementById("nombre").value.trim(),
        descripcion: document.getElementById("descripcion").value.trim(),
        precio: parseFloat(document.getElementById("precio").value),
        stock: parseInt(document.getElementById("stock").value),
        color: document.getElementById("color").value.trim(),
        estado: document.getElementById("estado").value,
        imagen: document.getElementById("imagen").value.trim()
      };

      fetch("http://127.0.0.1:5000/productos/agregar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nuevoProducto)
      })
      .then(async res => {
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Error al crear el producto");
        return data;
      })
      .then(data => {
        alert(data.message || "¡Producto creado con éxito!");
        window.location.replace("producto.html");
      })
      .catch(err => {
        console.error("Error:", err);
        alert("No se pudo guardar: " + err.message);
      });
    });
  </script>

</body>
</html>
