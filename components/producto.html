<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Administración X-Bits</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="../static/Icono.png" alt="Logo X-Bits" class="logo-img">
      <h1>X-Bits Admin</h1>
    </div>

    <nav>
      <ul>
        <!-- <li><a href="productos.html">Productos</a></li> -->
        <li><a href="reportes.html">Reportes</a></li>
        <!-- <li><a href="../index.html">Tienda</a></li> -->
        <li><a href="#" id="saludo-admin" style="color: #2ecc71;">Admin</a></li>
        <li><a href="#" onclick="cerrarSesion()">Salir</a></li>
      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Mantenimiento de Productos</h2>

    <a href="nuevoproducto.html" class="btn-principal">
      Agregar Nuevo Producto
    </a>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Producto</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productos">
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits - Administración</p>
  </footer>

  <script>
    const adminData = JSON.parse(localStorage.getItem("adminXBits"));
    if (!adminData) {
      alert("Acceso denegado. Inicia sesión primero.");
      window.location.href = "login.html";
    } else {
      document.getElementById("saludo-admin").innerText = `Hola, ${adminData.nombre}`;
    }

    function cerrarSesion() {
      localStorage.removeItem("adminXBits");
      window.location.href = "login.html";
    }

function cargarProductosAdmin() {
      fetch("http://127.0.0.1:5000/productos?admin=true")
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("tabla-productos");
          tbody.innerHTML = "";

          if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">No hay productos registrados.</td></tr>`;
            return;
          }

          data.forEach(p => {
            const estadoClase = p.estado === 'activo' ? 'activo' : 'inactivo'; 
            const estadoTexto = p.estado === 'activo' ? 'Activo' : `Inactivo (Stock: ${p.stock})`;

            tbody.innerHTML += `
              <tr>
                <td>${p.id}</td>
                <td>${p.nombre}</td>
                <td>$${p.precio}</td>
                <td>
                  <span class="estado ${estadoClase}" style="${p.estado !== 'activo' ? 'color: red; font-weight: bold;' : ''}">
                    ${estadoTexto}
                  </span>
                </td>
                <td>
                  <a href="editarproducto.html?id=${p.id}" class="btn-principal" style="padding: 5px 10px; font-size: 12px;">
                    Editar
                  </a>
                  <button type="button" class="btn-eliminar" onclick="eliminarProducto(${p.id})" style="background-color: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">
                    Eliminar
                  </button>
                </td>
              </tr>
            `;
          });
        })
        .catch(err => {
          console.error("Error al cargar productos para administración:", err);
          document.getElementById("tabla-productos").innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Error al conectar con el servidor.</td></tr>`;
        });
    }

    function eliminarProducto(id) {
      if (!confirm("¿Estás seguro de eliminar este producto?")) return;

      fetch(`http://127.0.0.1:5000/productos/eliminar/${id}`, {
        method: "DELETE"
      })
      .then(async res => {
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "No se pudo eliminar");
        return data;
      })
      .then(data => {
        alert(data.message || "Producto eliminado");
        cargarProductosAdmin();
      })
      .catch(err => {
        alert("Error: " + err.message);
      });
    }
    cargarProductosAdmin();
  </script>

</body>
</html>
