<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - X-Bits</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="../static/Icono.png" alt="Logo X-Bits" class="logo-img"> 
      <h1>X-Bits</h1>
    </div>
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../index.html#productos">Productos</a></li>
        <li><a href="../components/carrito.html">Carrito</a></li>
        <li><a href="../components/login.html">Administrador</a></li>
      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Detalle del Producto</h2>
    <div class="detalle-producto" id="detalle"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits</p>
    <a href="terminos.html">Términos y Condiciones</a> |
    <a href="privacidad.html">Políticas de Privacidad</a>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      document.getElementById("detalle").innerHTML = "<p>Error: No se especificó un producto.</p>";
    } else {
      fetch(`http://127.0.0.1:5000/productos/${id}`)
        .then(res => res.json())
        .then(producto => {
          const idProducto = producto.id_producto || producto.id;
          const stockDisponible = producto.stock !== undefined ? producto.stock : 0;

          document.getElementById("detalle").innerHTML = `
            <img src="${producto.imagen_url || producto.imagen}" alt="${producto.nombre}">
            <div class="detalle-info">
              <h2>${producto.nombre}</h2>
              <p><b>Precio:</b> $${producto.precio}</p>
              <p><b>Descripción:</b> ${producto.descripcion}</p>
              <p><b>Stock disponible:</b> <span style="color: ${stockDisponible > 0 ? '#2ecc71' : '#e74c3c'}; font-weight: bold;">${stockDisponible} unidades</span></p>
              ${stockDisponible > 0 
                ? `<button class="btn-principal" onclick="agregar(${idProducto})">Agregar al Carrito</button>`
                : `<p style="color: #e74c3c; font-weight: bold;">Producto Agotado</p>`
              }
            </div>
          `;
        })
        .catch(err => console.error("Error al cargar producto:", err));
    }

    function agregar(id_producto) {
      if (!id_producto) {
        alert("Error: No se encontró el ID del producto.");
        return;
      }

      fetch("http://127.0.0.1:5000/carrito/agregar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_producto: id_producto, cantidad: 1 })
      })
      .then(async res => {
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Ocurrió un error en el servidor.");
        }
        return data;
      })
      .then(data => {
        alert(data.message);
        window.location.href = "carrito.html";
      })
      .catch(err => {
        console.error("Error al agregar al carrito:", err);
        alert("No se pudo agregar al carrito: " + err.message);
      });
    }
  </script>

</body>
</html>
