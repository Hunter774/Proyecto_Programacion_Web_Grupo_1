<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - X-Bits</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/carrito.css">
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="../static/Icono.png" alt="Logo X-Bits" class="logo-img">
    <h1>X-Bits</h1>
  </div>
  <nav>
    <ul>
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="../index.html#productos">Productos</a></li>
      <li><a href="carrito.html">Carrito</a></li>
      <li><a href="login.html">Administrador</a></li>
    </ul>
  </nav>
</header>

<main class="carrito">
  <h2>Tu Carrito de Compras</h2>
  <div class="carrito-lista" id="carrito-lista"></div>
  <div class="resumen-carrito" id="resumen"></div>
  <div class="carrito-acciones">
    <a href="../index.html" class="btn-secundario">Seguir comprando</a>
    <button class="btn-comprar" onclick="realizarCompra(1)">Comprar</button>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2026 X-Bits</p>
  <a href="terminos.html">Términos y Condiciones</a> |
  <a href="privacidad.html">Políticas de Privacidad</a>
</footer>

<script>
  function cargarCarrito() {
    fetch("http://127.0.0.1:5000/carrito/1")
      .then(res => res.json())
      .then(data => {
        const contenedor = document.getElementById("carrito-lista");
        const resumen = document.getElementById("resumen");
        contenedor.innerHTML = "";

        if (!data.items || data.items.length === 0) {
          contenedor.innerHTML = "<p>El carrito está vacío.</p>";
          resumen.innerHTML = "<p><b>Total:</b> $0</p>";
          return;
        }

        data.items.forEach(item => {
          const idEliminar = item.id_detalle || item.id_producto;

          contenedor.innerHTML += `
            <div class="item" style="display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 15px;">
                <img src="${item.imagen}" alt="${item.nombre}">
                <div class="info">
                  <h3>${item.nombre}</h3>
                  <p>$${item.precio_unitario} x ${item.cantidad} = $${item.subtotal}</p>
                </div>
              </div>
              <button class="btn-eliminar" onclick="eliminar(${idEliminar})" style="background-color: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">
                Eliminar
              </button>
            </div>
          `;
        });
        resumen.innerHTML = `<p><b>Total:</b> $${data.total}</p>`;
      })
      .catch(err => {
        document.getElementById("carrito-lista").innerHTML = "<p>Error cargando carrito</p>";
        console.error(err);
      });
  }

  function eliminar(id_detalle) {
    if (!confirm("¿Seguro que deseas eliminar este producto del carrito?")) return;

    fetch(`http://127.0.0.1:5000/carrito/eliminar/${id_detalle}`, {
      method: "DELETE"
    })
    .then(async res => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al eliminar");
      return data;
    })
    .then(data => {
      cargarCarrito();
    })
    .catch(err => {
      alert("No se pudo eliminar: " + err.message);
      console.error(err);
    });
  }

  function realizarCompra(idUsuario) {
    if (!confirm("¿Deseas confirmar y procesar tu compra?")) return;

    fetch(`http://127.0.0.1:5000/carrito/comprar/${idUsuario}`, {
      method: "POST"
    })
    .then(async res => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error al procesar la compra");
      return data;
    })
    .then(data => {
      alert("¡Compra realizada con éxito! Se ha generado tu orden.");
      cargarCarrito();
    })
    .catch(err => {
      alert("No se pudo completar la compra: " + err.message);
      console.error(err);
    });
  }

  cargarCarrito();
</script>

</body>
</html>
