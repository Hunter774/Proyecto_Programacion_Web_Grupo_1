<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - X-Bits</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="../static/Icono.png" alt="Logo X-Bits" class="logo-img">
      <h1>X-Bits</h1>
    </div>

    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../index.html#productos">Productos</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="login.html">Administrador</a></li>
      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Registro de Administrador</h2>

    <form class="formulario" id="form-registro">

      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="usuario">Usuario:</label>
      <input type="text" id="usuario" name="usuario" required>

      <label for="contrasena">Contraseña:</label>
      <input type="password" id="contrasena" name="contrasena" required>

      <label for="confirmar">Confirmar contraseña:</label>
      <input type="password" id="confirmar" name="confirmar" required>

      <div class="form-acciones">
        <button type="submit" class="btn-principal">
          Registrar
        </button>

        <a href="login.html" class="btn-secundario">
          Volver al Login
        </a>
      </div>

    </form>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits</p>
    <a href="#">Términos y Condiciones</a> | <a href="#">Políticas de Privacidad</a>
  </footer>

  <script>
    document.getElementById("form-registro").addEventListener("submit", function(e) {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const usuario = document.getElementById("usuario").value.trim();
      const contrasena = document.getElementById("contrasena").value;
      const confirmar = document.getElementById("confirmar").value;

      if (contrasena !== confirmar) {
        alert("Las contraseñas no coinciden.");
        return;
      }

      const datos = { nombre, correo, usuario, contrasena };

      fetch("http://127.0.0.1:5000/registro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      })
      .then(async res => {
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Error al registrar el usuario.");
        }
        return data;
      })
      .then(data => {
        alert(data.message);
        window.location.href = "login.html";
      })
      .catch(err => {
        console.error("Error:", err);
        alert("No se pudo completar el registro: " + err.message);
      });
    });
  </script>

</body>
</html>
