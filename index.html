<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choclobits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="icon">💻</span>
      <h1>Choclobits</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Carrito</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>
  <main class="catalogo">
    <h2>Catálogo de Productos</h2>
    <div class="productos">
      <div class="card">
        <img src="https://m.media-amazon.com/images/I/71EjPGMpNgL._AC_SX679_.jpg" alt="Laptop Gamer">
        <h3>Laptop Gamer</h3>
        <p>$1200</p>
        <button>Ver Detalle</button>
      </div>
      <div class="card">
        <img src="https://m.media-amazon.com/images/I/71pszRoOwUL._AC_SY741_.jpg" alt="Smartphone 5G">
        <h3>Smartphone 5G</h3>
        <p>$800</p>
        <button>Ver Detalle</button>
      </div>
      <div class="card">
        <img src="https://m.media-amazon.com/images/I/31yq9PU7LDL._SS400_.jpg" alt="Audífonos Bluetooth">
        <h3>Audífonos Bluetooth</h3>
        <p>$150</p>
        <button>Ver Detalle</button>
      </div>
    </div>
  </main>
  <footer class="footer">
    <p>&copy; 2026 Tienda Tech</p>
    <a href="#">Términos y Condiciones</a> | 
    <a href="#">Políticas de Privacidad</a>
  </footer>
</body>
</html>
