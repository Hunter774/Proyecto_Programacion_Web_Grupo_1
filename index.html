<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Bits</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">

    <div class="logo">
      <img src="static/Icono.png" alt="Logo X-Bits" class="logo-img">
      <h1>X-Bits</h1>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html">Productos</a></li>
        <li><a href="components/carrito.html">Carrito</a></li>
        <li><a href="components/login.html">Administrador</a></li>
      </ul>
    </nav>

  </header>

  <main class="catalogo" id="productos">

    <h2>Catálogo de Productos</h2>

    <p class="subtitulo">
      Tecnología para estudiar, trabajar y disfrutar.
    </p>

    <!-- Render de los productos dinámicamente -->
    <div class="productos" id="productos-container">
    </div>

  </main>

  <footer class="footer">

    <p>&copy; 2026 X-Bits</p>
    <a href="terminos.html">Términos y Condiciones</a>
    |
    <a href="privacidad.html">Políticas de Privacidad</a>

  </footer>

  <!-- Script para jalar productos desde el servidor de Flask -->
  <script>
    fetch("http://127.0.0.1:5000/productos")
      .then(res => res.json())
      .then(data => {
        const contenedor = document.getElementById("productos-container");
        contenedor.innerHTML = "";
        data.forEach(p => {
          contenedor.innerHTML += `
            <div class="card">
              <img src="${p.imagen}" alt="${p.nombre}">
              <h3>${p.nombre}</h3>
              <p class="precio">$${p.precio}</p>
              <a class="btn-principal" href="detalle.html?id=${p.id}">
                Ver Detalle
              </a>
            </div>
          `;
        });
      })
      .catch(err => {
        console.error("Error cargando productos:", err);
      });
  </script>

</body>
</html>
