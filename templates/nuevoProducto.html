<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto - X-Bits Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="{{ url_for('static', filename='icons/Icono.png') }}" 
           alt="Logo Xucle-Bits" 
           class="logo-img">
      <h1>X-Bits Admin</h1>
    </div>

    <nav>
      <ul>
        <li><a href="{{ url_for('productos_admin') }}">Productos</a></li>
        <li><a href="{{ url_for('reportes') }}">Reportes</a></li>
      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Agregar Nuevo Producto</h2>

    <form class="formulario" action="{{ url_for('nuevo_producto') }}" method="POST">

      <label for="nombre">Nombre del producto:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion" required></textarea>

      <label for="precio">Precio:</label>
      <input type="number" id="precio" name="precio" step="0.01" min="0" required>

      <label for="stock">Cantidad / Stock:</label>
      <input type="number" id="stock" name="stock" min="0" required>

      <label for="color">Color:</label>
      <input type="text" id="color" name="color">

      <label for="estado">Estado:</label>
      <select id="estado" name="estado" required>
        <option value="activo" selected>Activo</option>
        <option value="inactivo">Inactivo</option>
      </select>

      <label for="imagen">URL de imagen:</label>
      <input type="url" id="imagen" name="imagen" placeholder="https://ejemplo.com/imagen.png">

      <div class="form-acciones">
        <button type="submit" class="btn-principal">
          Guardar Producto
        </button>

        <a href="{{ url_for('productos_admin') }}" class="btn-secundario">
          Cancelar
        </a>
      </div>

    </form>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits - Panel de Administración</p>
  </footer>

</body>
</html>
