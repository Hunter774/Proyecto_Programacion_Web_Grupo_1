<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Nuevo Producto - Xucle-Bits
  </title>

  <link rel="stylesheet"
        href="../style.css">

</head>

<body>

  <header class="header">

    <div class="logo">

      <img src="../icons/Icono.png"
           alt="Logo Xucle-Bits"
           class="logo-img">

      <h1>Xucle-Bits Admin</h1>

    </div>

    <nav>

      <ul>

        <li>
          <a href="producto.html">
            Productos
          </a>
        </li>

        <li>
          <a href="Reportes.html">
            Reportes
          </a>
        </li>

      </ul>

    </nav>

  </header>


  <main class="pagina">

    <h2>
      Agregar Nuevo Producto
    </h2>


    <form class="formulario">

      <label for="nombre">
        Nombre del producto:
      </label>

      <input type="text"
             id="nombre"
             required>


      <label for="descripcion">
        Descripción:
      </label>

      <textarea id="descripcion"
                required></textarea>


      <label for="precio">
        Precio:
      </label>

      <input type="number"
             id="precio"
             required>


      <label for="stock">
        Cantidad:
      </label>

      <input type="number"
             id="stock"
             required>


      <label for="color">
        Color:
      </label>

      <input type="text"
             id="color">


      <label for="estado">
        Estado:
      </label>

      <select id="estado"
              required>

        <option value="activo">
          Activo
        </option>

        <option value="inactivo">
          Inactivo
        </option>

      </select>


      <label for="imagen">
        URL de imagen:
      </label>

      <input type="text"
             id="imagen">


      <div class="form-acciones">

        <button type="button"
                class="btn-principal">
          Guardar Producto
        </button>

        <a href="producto.html"
           class="btn-secundario">
          Cancelar
        </a>

      </div>

    </form>

  </main>


  <footer class="footer">

    <p>
      &copy; 2026 Xucle-Bits - Administración
    </p>

  </footer>

</body>
</html>
