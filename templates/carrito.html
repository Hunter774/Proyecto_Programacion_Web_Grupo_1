<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Xucle-Bits</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="carrito.css">
</head>

<body>

  <header class="header">

    <div class="logo">

      <img src="../icons/Icono.png"
           alt="Logo Xucle-Bits"
           class="logo-img">

      <h1>Xucle-Bits</h1>

    </div>

    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../index.html#productos">Productos</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="login.html">Administrador</a></li>
      </ul>
    </nav>

  </header>


  <main class="carrito">

    <h2>Tu Carrito de Compras</h2>

    <div class="carrito-lista">

      <div class="item">

        <img src="https://m.media-amazon.com/images/I/71EjPGMpNgL._AC_SX679_.jpg"
             alt="Laptop Gamer">

        <div class="info">
          <h3>Laptop Gamer</h3>
          <p>$1200</p>
        </div>

        <button class="btn-eliminar">
          Eliminar
        </button>

      </div>


      <div class="item">

        <img src="https://m.media-amazon.com/images/I/71pszRoOwUL._AC_SY741_.jpg"
             alt="Smartphone 5G">

        <div class="info">
          <h3>Smartphone 5G</h3>
          <p>$800</p>
        </div>

        <button class="btn-eliminar">
          Eliminar
        </button>

      </div>

    </div>


    <div class="resumen-carrito">
      <p>
        <b>Total:</b> $2000
      </p>
    </div>


    <div class="carrito-acciones">

      <a href="../index.html"
         class="btn-secundario">
        Seguir comprando
      </a>

      <button class="btn-comprar">
        Comprar
      </button>

    </div>

  </main>


  <footer class="footer">

    <p>&copy; 2026 Xucle-Bits</p>

    <a href="terminos.html">
      Términos y Condiciones
    </a>

    |

    <a href="privacidad.html">
      Políticas de Privacidad
    </a>

  </footer>

</body>
</html>
