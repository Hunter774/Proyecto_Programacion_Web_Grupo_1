<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Xucle-Bits</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='carrito.css') }}">
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="{{ url_for('static', filename='icons/Icono.png') }}" alt="Logo X-Bits" class="logo-img">
    <h1>X-Bits</h1>
  </div>
  <nav>
    <ul>
      <li><a href="{{ url_for('index') }}">Inicio</a></li>
      <li><a href="{{ url_for('index') }}#productos">Productos</a></li>
      <li><a href="{{ url_for('carrito') }}">Carrito</a></li>
      <li><a href="{{ url_for('login') }}">Administrador</a></li>
    </ul>
  </nav>
</header>

<main class="carrito">
  <h2>Tu Carrito de Compras</h2>
  <div class="carrito-lista" id="carrito-lista"></div>
  <div class="resumen-carrito" id="resumen"></div>
  <div class="carrito-acciones">
    <a href="{{ url_for('index') }}" class="btn-secundario">Seguir comprando</a>
    <button class="btn-comprar">Comprar</button>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2026 X-Bits</p>
  <a href="{{ url_for('terminos') }}">Términos y Condiciones</a> |
  <a href="{{ url_for('privacidad') }}">Políticas de Privacidad</a>
</footer>

<script>
  // Por ahora usamos el usuario local con id=1
  fetch("/carrito/1")
    .then(res => res.json())
    .then(data => {
      const contenedor = document.getElementById("carrito-lista");
      const resumen = document.getElementById("resumen");
      contenedor.innerHTML = "";
      data.items.forEach(item => {
        contenedor.innerHTML += `
          <div class="item">
            <img src="${item.imagen}" alt="${item.nombre}">
            <div class="info">
              <h3>${item.nombre}</h3>
              <p>$${item.precio_unitario} x ${item.cantidad} = $${item.subtotal}</p>
            </div>
          </div>
        `;
      });
      resumen.innerHTML = `<p><b>Total:</b> $${data.total}</p>`;
    })
    .catch(err => {
      document.getElementById("carrito-lista").innerHTML = "<p>Error cargando carrito</p>";
      console.error(err);
    });
</script>

</body>
</html>
