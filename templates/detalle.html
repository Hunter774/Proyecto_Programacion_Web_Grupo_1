<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - X-Bits</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="header">
    <div class="logo">
    <img src="{{ url_for('static', filename='icons/Icono.png') }}" alt="Logo X-Bits" class="logo-img"> 
      <h1>X-Bits</h1>
    </div>
    <nav>
      <ul>
        <li><a href="{{ url_for('index') }}">Inicio</a></li>
        <li><a href="{{ url_for('index') }}#productos">Productos</a></li>
        <li><a href="{{ url_for('carrito') }}">Carrito</a></li>
        <li><a href="{{ url_for('login') }}">Administrador</a></li>

      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Detalle del Producto</h2>
    <div class="detalle-producto" id="detalle"></div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits</p>
    <a href="terminos.html">Términos y Condiciones</a> |
    <a href="privacidad.html">Políticas de Privacidad</a>
  </footer>

  <script>
  const id = {{ id }};
  fetch(`/productos/${id}`)
    .then(res => res.json())
    .then(producto => {
      document.getElementById("detalle").innerHTML = `
        <img src="${producto.imagen}" alt="${producto.nombre}">
        <div class="detalle-info">
          <h2>${producto.nombre}</h2>
          <p><b>Precio:</b> $${producto.precio}</p>
          <p><b>Descripción:</b> ${producto.descripcion}</p>
          <a href="carrito.html" class="btn-principal">Agregar al Carrito</a>
        </div>
      `;
    })
    .catch(err => {
      document.getElementById("detalle").innerHTML = "<p>Error cargando producto</p>";
      console.error(err);
    });
</script>

</body>
</html>
