<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - X-Bits</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <header class="header">
    <div class="logo">
      <img src="{{ url_for('static', filename='icons/Icono.png') }}" 
           alt="Logo Xucle-Bits" 
           class="logo-img">
      <h1>X-Bits</h1>
    </div>

    <nav>
      <ul>
        <li><a href="{{ url_for('index') }}">Inicio</a></li>
        <li><a href="{{ url_for('index') }}#productos">Productos</a></li>
        <li><a href="{{ url_for('carrito') }}">Carrito</a></li>
        <li><a href="{{ url_for('login') }}">Administrador</a></li>
      </ul>
    </nav>
  </header>

  <main class="pagina">
    <h2>Registro de Administrador</h2>

    <form class="formulario" action="{{ url_for('registro') }}" method="POST">

      <label for="nombre">Nombre:</label>
      <input type="text" 
             id="nombre" 
             name="nombre" 
             required>

      <label for="correo">Correo:</label>
      <input type="email" 
             id="correo" 
             name="correo" 
             required>

      <label for="usuario">Usuario:</label>
      <input type="text" 
             id="usuario" 
             name="usuario" 
             required>

      <label for="contrasena">Contraseña:</label>
      <input type="password" 
             id="contrasena" 
             name="contrasena" 
             required>

      <label for="confirmar">Confirmar contraseña:</label>
      <input type="password" 
             id="confirmar" 
             name="confirmar" 
             required>

      <div class="form-acciones">
        <button type="submit" class="btn-principal">
          Registrar
        </button>

        <a href="{{ url_for('login') }}" class="btn-secundario">
          Volver al Login
        </a>
      </div>

    </form>
  </main>

  <footer class="footer">
    <p>&copy; 2026 X-Bits</p>
    <a href="#">Términos y Condiciones</a> | <a href="#">Políticas de Privacidad</a>
  </footer>

</body>
</html>
