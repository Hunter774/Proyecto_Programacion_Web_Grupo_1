<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Xucle-Bits</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header class="header">

    <div class="logo">

      <img src="../icons/Icono.png"
           alt="Logo Xucle-Bits"
           class="logo-img">

      <h1>Xucle-Bits</h1>

    </div>

  </header>


  <main class="pagina">

    <h2>Registro de Administrador</h2>

    <form class="formulario">

      <label for="nombre">
        Nombre:
      </label>

      <input type="text"
             id="nombre"
             required>


      <label for="correo">
        Correo:
      </label>

      <input type="email"
             id="correo"
             required>


      <label for="usuario">
        Usuario:
      </label>

      <input type="text"
             id="usuario"
             required>


      <label for="contrasena">
        Contraseña:
      </label>

      <input type="password"
             id="contrasena"
             required>


      <label for="confirmar">
        Confirmar contraseña:
      </label>

      <input type="password"
             id="confirmar"
             required>


      <div class="form-acciones">

        <button type="button"
                class="btn-principal">
          Registrar
        </button>

        <a href="login.html"
           class="btn-secundario">
          Volver al Login
        </a>

      </div>

    </form>

  </main>


  <footer class="footer">
    <p>&copy; 2026 Xucle-Bits</p>
  </footer>

</body>
</html>
