<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Bits</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

  <header class="header">

    <div class="logo">
      <img src="{{ url_for('static', filename='icons/Icono.png') }}" 
           alt="Logo Xucle-Bits" class="logo-img">
      <h1>X-Bits</h1>
    </div>

    <nav>
      <ul>
        <li><a href="{{ url_for('index') }}">Inicio</a></li>
        <li><a href="{{ url_for('index') }}">Productos</a></li>
        <li><a href="{{ url_for('carrito') }}">Carrito</a></li>
        <li><a href="{{ url_for('login') }}">Administrador</a></li>
      </ul>
    </nav>

  </header>


  <main class="catalogo" id="productos">

    <h2>Catálogo de Productos</h2>

    <p class="subtitulo">
      Tecnología para estudiar, trabajar y disfrutar.
    </p>

    <!--render de los productos dinamicamente -->
    <div class="productos" id="productos-container">
    </div>

  </main>


  <footer class="footer">

    <p>&copy; 2026 X-Bits</p>
    <a href="{{ url_for('terminos') }}">
      Términos y Condiciones
    </a>

    |

    <a href="{{ url_for('privacidad') }}">
      Políticas de Privacidad
    </a>

  </footer>

  <!-- script para jalar productos desde el endpoint -->
  <script>
    fetch("/productos")
      .then(res => res.json())
      .then(data => {
        const contenedor = document.getElementById("productos-container");
        contenedor.innerHTML = "";
        data.forEach(p => {
          contenedor.innerHTML += `
            <div class="card">
              <img src="${p.imagen}" alt="${p.nombre}">
              <h3>${p.nombre}</h3>
              <p class="precio">$${p.precio}</p>
              <a class="btn-principal" href="/detalle/${p.id}">
                Ver Detalle
              </a>
            </div>
          `;
        });
      })
      .catch(err => {
        console.error("Error cargando productos:", err);
      });
  </script>

</body>
</html>
