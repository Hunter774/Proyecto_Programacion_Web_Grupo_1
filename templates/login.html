<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin - X-Bits</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="{{ url_for('static', filename='icons/Icono.png') }}" alt="Logo X-Bits" class="logo-img">
    <h1>X-Bits</h1>
  </div>
  <nav>
    <ul>
      <li><a href="{{ url_for('index') }}">Inicio</a></li>
      <li><a href="{{ url_for('index') }}#productos">Productos</a></li>
      <li><a href="{{ url_for('carrito') }}">Carrito</a></li>
      <li><a href="{{ url_for('login') }}">Administrador</a></li>
    </ul>
  </nav>
</header>

<main class="pagina">
  <h2>Acceso Administrativo</h2>

  <form class="formulario" action="{{ url_for('login') }}" method="POST">
    <label for="usuario">Usuario:</label>
    <input type="text" id="usuario" name="usuario" required>

    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" required>

    <div class="form-acciones">
      <button type="submit" class="btn-principal">Ingresar</button>
      <a href="{{ url_for('login') }}" class="btn-secundario">Registrar Administrador</a>
    </div>
  </form>
</main>

<footer class="footer">
  <p>&copy; 2026 X-Bits</p>
  <a href="#">Términos y Condiciones</a> | <a href="#">Políticas de Privacidad</a>
</footer>

</body>
</html>
