<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Productos - Administración Xucle-Bits
  </title>

  <link rel="stylesheet"
        href="../style.css">

</head>

<body>

  <header class="header">

    <div class="logo">

      <img src="../icons/Icono.png"
           alt="Logo Xucle-Bits"
           class="logo-img">

      <h1>Xucle-Bits Admin</h1>

    </div>


    <nav>

      <ul>

        <li>
          <a href="producto.html">
            Productos
          </a>
        </li>

        <li>
          <a href="Reportes.html">
            Reportes
          </a>
        </li>

        <li>
          <a href="../index.html">
            Tienda
          </a>
        </li>

      </ul>

    </nav>

  </header>


  <main class="pagina">

    <h2>
      Mantenimiento de Productos
    </h2>


    <a href="nuevoProducto.html"
       class="btn-principal">
      Agregar Nuevo Producto
    </a>


    <div class="tabla-contenedor">

      <table>

        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Precio</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>


        <tr>

          <td>1</td>

          <td>Laptop Gamer</td>

          <td>$1200</td>

          <td>
            <span class="estado activo">
              Activo
            </span>
          </td>

          <td>

            <a href="editarProducto.html"
               class="btn-principal">
              Editar
            </a>

            <button type="button"
                    class="btn-eliminar">
              Eliminar
            </button>

          </td>

        </tr>


        <tr>

          <td>2</td>

          <td>Smartphone 5G</td>

          <td>$800</td>

          <td>
            <span class="estado activo">
              Activo
            </span>
          </td>

          <td>

            <a href="editarProducto.html"
               class="btn-principal">
              Editar
            </a>

            <button type="button"
                    class="btn-eliminar">
              Eliminar
            </button>

          </td>

        </tr>


        <tr>

          <td>3</td>

          <td>Audífonos Bluetooth</td>

          <td>$150</td>

          <td>
            <span class="estado inactivo">
              Inactivo
            </span>
          </td>

          <td>

            <a href="editarProducto.html"
               class="btn-principal">
              Editar
            </a>

            <button type="button"
                    class="btn-eliminar">
              Eliminar
            </button>

          </td>

        </tr>

      </table>

    </div>

  </main>


  <footer class="footer">

    <p>
      &copy; 2026 Xucle-Bits - Administración
    </p>

  </footer>

</body>
</html>
